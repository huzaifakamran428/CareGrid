# Routes each URL prefix to its service (ports match docker-compose.yml)
events {}
http {
  server {
    listen 80;
    location /auth/          { proxy_pass http://auth_service:8001/; }
    location /ngo/           { proxy_pass http://ngo_service:8002/; }
    location /food/          { proxy_pass http://food_service:8003/; }
    location /medical/       { proxy_pass http://medical_service:8004/; }
    location /finance/       { proxy_pass http://finance_service:8005/; }
    location /notifications/ { proxy_pass http://notification_service:8006/; }
    location /admin-portal/  { proxy_pass http://admin_portal:8007/; }
    location /ai/food/       { proxy_pass http://food_demand:9001/; }
    location /ai/ocr/        { proxy_pass http://prescription_ocr:9002/; }
    location /ai/chat/       { proxy_pass http://rag_chatbot:9003/; }
  }
}

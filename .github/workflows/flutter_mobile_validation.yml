name: Flutter mobile validation

on:
  pull_request:
    paths:
      - 'frontend/mobile_app/**'
      - '.github/workflows/flutter_mobile_validation.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/mobile_app/**'

jobs:
  flutter-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mobile_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Flutter analyzer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run unit and widget tests
        run: flutter test

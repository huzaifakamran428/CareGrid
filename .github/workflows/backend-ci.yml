name: Backend CI
on:
  pull_request:
    paths: ["backend/**"]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install flake8
      - run: flake8 backend --max-line-length=120 --exclude=migrations,venv

name: CareGrid web demo validation
on:
  pull_request:
    paths:
      - 'frontend/web/**'
      - '.github/workflows/web_demo_validation.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/web/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check frontend/web/shared/assistant.js
          node --check frontend/web/admin_portal/assets/assistant_admin.js
          node --check frontend/web/admin_portal/assets/app.js
          node --check frontend/web/ngo_portal/assets/app.js
      - name: Assistant behavior and role checks
        run: node frontend/web/tests/assistant_demo.test.js
      - name: Shared portal links
        run: python3 -m unittest discover -s frontend/web/tests -p 'test_*.py' -v
      - name: Server module syntax
        run: |
          python3 -m py_compile frontend/web/run_local_demo.py
          python3 -m py_compile frontend/web/demo_assistant_backend.py
      - name: Unified Django role and license tests
        run: |
          python3 -m pip install -r frontend/web/django_portal/requirements.txt
          cd frontend/web/django_portal
          python3 manage.py check
          python3 manage.py test modules.auth_module

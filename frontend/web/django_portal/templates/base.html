{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}CareGrid — Compassion Connected{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --cg-primary: #087C69;
      --cg-primary-dark: #075A50;
      --cg-primary-light: #E5F5EE;
      --cg-mint-border: #B2DFCE;
      --cg-bg: #F4F8F6;
      --cg-surface: #FFFFFF;
      --cg-amber: #E3A33B;
      --cg-amber-bg: #FFF4E2;
      --cg-amber-border: #F3D196;
      --cg-danger: #BC4751;
      --cg-danger-bg: #FFECEE;
      --cg-danger-border: #E5A1A7;
      --cg-text-main: #173D37;
      --cg-text-muted: #58746D;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--cg-bg);
      color: var(--cg-text-main);
    }
    .cg-navbar {
      background: linear-gradient(110deg, var(--cg-primary-dark), var(--cg-primary));
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .cg-card {
      background: var(--cg-surface);
      border: 1px solid #DAE8E1;
      border-radius: 18px;
      box-shadow: 0 10px 28px rgba(7, 90, 80, 0.06);
    }
    .btn-cg-primary {
      background: linear-gradient(135deg, var(--cg-primary), var(--cg-primary-dark));
      border: none;
      color: #fff;
      font-weight: 700;
      border-radius: 12px;
      padding: 0.68rem 1.3rem;
      transition: all 0.16s ease;
    }
    .btn-cg-primary:hover {
      color: #fff;
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(8, 124, 105, 0.24);
    }
    .btn-cg-outline {
      background-color: var(--cg-primary-light);
      border: 1px solid var(--cg-mint-border);
      color: var(--cg-primary-dark);
      font-weight: 700;
      border-radius: 12px;
    }
    .btn-cg-outline:hover {
      background-color: #d4ede2;
      color: var(--cg-primary-dark);
    }
    .form-control-cg, .form-select-cg {
      border: 1.5px solid #D3E4DC;
      border-radius: 12px;
      padding: 0.68rem 0.95rem;
      font-size: 0.94rem;
      color: var(--cg-text-main);
      background-color: #FFFFFF;
    }
    .form-control-cg:focus, .form-select-cg:focus {
      border-color: var(--cg-primary);
      box-shadow: 0 0 0 0.22rem rgba(8, 124, 105, 0.14);
    }
    .cg-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--cg-text-muted);
      margin-bottom: 0.38rem;
    }
    .cg-mint-box {
      background-color: var(--cg-primary-light);
      border: 1px solid var(--cg-mint-border);
      border-radius: 14px;
    }
    .cg-amber-box {
      background-color: var(--cg-amber-bg);
      border: 1px solid var(--cg-amber-border);
      border-radius: 14px;
      color: #6E4706;
    }
    .badge-story {
      background-color: var(--cg-amber);
      color: #173D37;
      font-weight: 800;
      font-size: 0.72rem;
      padding: 0.35rem 0.7rem;
      border-radius: 8px;
    }
    .badge-active { background-color: #D1E7DD; color: #0F5132; font-weight: 700; }
    .badge-authorized { background-color: #FEF3C7; color: #92400E; font-weight: 700; }
    .badge-suspended { background-color: var(--cg-danger-bg); color: var(--cg-danger); font-weight: 700; }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  {% if request.session.cg_user %}
  <nav class="navbar navbar-expand-lg navbar-dark cg-navbar py-2 px-lg-4">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{% url 'web_login' %}">
        <img src="{% static 'img/caregrid_logo.png' %}" alt="CareGrid" height="36" class="rounded-3 bg-white p-1">
        <span>Care<span style="color: var(--cg-amber);">Grid</span></span>
      </a>
      <div class="d-flex align-items-center gap-3 ms-auto">
        <span class="badge rounded-pill px-3 py-2" style="background: rgba(255,255,255,0.14); font-weight: 600;">
          <i class="bi bi-person-check-fill text-warning me-1"></i>
          {{ request.session.cg_user.name }}
        </span>
        <a href="{% url 'preview_library' %}" class="btn btn-sm btn-outline-light rounded-3 fw-semibold">Feature screens</a>
        <a href="{% url 'web_logout' %}" class="btn btn-sm btn-outline-light rounded-3 fw-semibold">
          <i class="bi bi-box-arrow-right me-1"></i>Sign Out
        </a>
      </div>
    </div>
  </nav>
  {% endif %}

  {% block content %}{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>

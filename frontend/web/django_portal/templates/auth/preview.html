{% extends "base.html" %}
{% block title %}CareGrid — {{ title }}{% endblock %}
{% block content %}
<main class="container-fluid py-3 px-3">
  <div class="d-flex flex-wrap align-items-center justify-content-between mb-2 gap-2"><h1 class="h5 fw-bold mb-0">{{ title }}</h1><a class="btn btn-cg-outline btn-sm" href="{% url 'preview_library' %}">All feature screens</a></div>
  <p class="small text-muted">Team UI preview — fictional data; changes here may not synchronize with the main dashboard.</p>
  <iframe title="{{ title }}" src="{% url 'preview_file' file_path %}" style="width:100%;height:75vh;border:1px solid #DAE8E1;border-radius:18px;background:white"></iframe>
</main>
{% endblock %}
